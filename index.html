  // ---------- Draggable drawer handles (pull up to expand) ----------
  let dragDrawer = null, dragStartY = 0, dragStartHeight = 0;
  function drawerMaxPx() { return Math.round(window.innerHeight * 0.92); }

  document.addEventListener('touchstart', e => {
    const handle = e.target.closest('.drawer-handle');
    if (!handle) return;
    dragDrawer = handle.closest('.drawer');
    dragStartY = e.touches[0].clientY;
    dragStartHeight = dragDrawer.getBoundingClientRect().height;
    dragDrawer.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragDrawer) return;
    const dy = dragStartY - e.touches[0].clientY;
    let newHeight = dragStartHeight + dy;
    newHeight = Math.max(220, Math.min(drawerMaxPx(), newHeight));
    dragDrawer.style.maxHeight = newHeight + 'px';
    dragDrawer.style.height = newHeight + 'px';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (dragDrawer) dragDrawer.style.transition = '';
    dragDrawer = null;
  });

  // mouse support for desktop testing
  document.addEventListener('mousedown', e => {
    const handle = e.target.closest('.drawer-handle');
    if (!handle) return;
    dragDrawer = handle.closest('.drawer');
    dragStartY = e.clientY;
    dragStartHeight = dragDrawer.getBoundingClientRect().height;
    dragDrawer.style.transition = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragDrawer) return;
    const dy = dragStartY - e.clientY;
    let newHeight = dragStartHeight + dy;
    newHeight = Math.max(220, Math.min(drawerMaxPx(), newHeight));
    dragDrawer.style.maxHeight = newHeight + 'px';
    dragDrawer.style.height = newHeight + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (dragDrawer) dragDrawer.style.transition = '';
    dragDrawer = null;
  });

  // reset any manually-set height each time a drawer opens fresh
  document.querySelectorAll('.drawer-overlay').forEach(ov => {
    ov.addEventListener('click', e => {
      if (e.currentTarget === e.target) {
        const d = ov.querySelector('.drawer');
        if (d) { d.style.height = ''; d.style.maxHeight = ''; }
      }
    });
  });

  // ---------- Deleting notes and saved verses ----------
  // A multi-verse note stores the text once under its start key and a {ref}
  // pointer on every other verse it covers. Sweep by ref rather than by span,
  // so a note deletes cleanly even when its book is not currently loaded.
  function deleteNoteAt(startKey) {
    delete notes[startKey];
    markDeleted('notes', startKey);
    Object.keys(notes).forEach(k => {
      const raw = notes[k];
      if (raw && raw.ref === startKey) delete notes[k];
    });
    localStorage.setItem('sj_notes', JSON.stringify(notes));
    scheduleCloudSync();
    refreshAllNoteIndicators();
    refreshRailState();
  }

  function deleteSavedAt(key) {
    delete saved[key];
    markDeleted('saved', key);
    localStorage.setItem('sj_saved', JSON.stringify(saved));
    scheduleCloudSync();
    refreshRailState();
  }

  // ---------- Book filter for the Notes and Saved lists ----------
  const listFilter = { saved: 'all', notes: 'all' };

  function filterSelectHtml(which, books, counts) {
    const current = listFilter[which];
    // A book that no longer has entries should not stay selected.
    if (current !== 'all' && books.indexOf(current) === -1) listFilter[which] = 'all';
    const total = books.reduce((n, b) => n + counts[b].length, 0);
    let html = `<select class="list-filter" id="filter-${which}">`;
    html += `<option value="all"${listFilter[which] === 'all' ? ' selected' : ''}>All books (${total})</option>`;
    books.forEach(b => {
      html += `<option value="${b}"${listFilter[which] === b ? ' selected' : ''}>${b} (${counts[b].length})</option>`;
    });
    return html + '</select>';
  }

  function wireFilter(which, rerender) {

  // Scrolling a verse past marks it read, so a fast scroll through a chapter
  // can register as read when it was not. Clear mode turns the chapter grid
  // into a way to undo that, one chapter at a time.
  let clearMode = false;

  function clearChapterProgress(book, chapter) {
    const count = CHAPTER_COUNTS[book][chapter - 1];
    let cleared = 0;
    for (let v = 1; v <= count; v++) {
      const key = `${book}:${chapter}:${v}`;
      if (readVerses[key]) { delete readVerses[key]; cleared++; }
    }
    localStorage.setItem('sj_read', JSON.stringify(readVerses));
    scheduleCloudSync();
    refreshRailState();
    return cleared;
  }

  function openBookDetail(book) {
    setTrayActive('home');
    setHomeTitle(book);
    const drawer = document.getElementById('home-content');
    const counts = CHAPTER_COUNTS[book];
    const readByChapter = counts.map((count, ci) => {
      let n = 0;
      for (let v = 1; v <= count; v++) if (readVerses[`${book}:${ci + 1}:${v}`]) n++;
      return n;
    });
    const anyRead = readByChapter.some(n => n > 0);

    let html = `<button class="back-btn" id="home-back">‹ Back to home</button>`;
    html += `<div class="verse-grid${clearMode ? ' clearing' : ''}" style="grid-template-columns:repeat(5,1fr);">`;
    counts.forEach((count, ci) => {
      const chapterNum = ci + 1;
      const readCount = readByChapter[ci];
      const isComplete = readCount === count;
      const cls = [
        'verse-box',
        isComplete ? 'read' : '',
        !isComplete && readCount > 0 ? 'partial' : '',
        readCount > 0 ? 'has-read' : '',
      ].filter(Boolean).join(' ');
      html += `<div class="${cls}" data-c="${chapterNum}" data-read="${readCount}" data-count="${count}" title="${readCount}/${count} read">${chapterNum}</div>`;
    });
    html += `</div>`;
    if (anyRead || clearMode) {
      html += `<button class="clear-toggle${clearMode ? ' active' : ''}" id="clear-toggle">${clearMode ? 'Done' : 'Clear a chapter'}</button>`;
    }
    if (clearMode) {
      html += `<p class="clear-hint">Tap a chapter to mark it unread.<br>Only chapters with progress can be cleared.</p>`;
    }
    drawer.innerHTML = html;

    document.getElementById('home-back').onclick = () => { clearMode = false; openHome(); };
    const toggle = document.getElementById('clear-toggle');
    if (toggle) toggle.onclick = () => { clearMode = !clearMode; openBookDetail(book); };

    drawer.querySelectorAll('.verse-box').forEach(box => {
      box.onclick = () => {
        const chapterNum = parseInt(box.dataset.c);
        if (!clearMode) {
          hideHomePage();
          switchToBook(book, chapterNum, 1);
          return;
        }
        const readCount = parseInt(box.dataset.read);
        if (!readCount) { showToast(`Nothing read in ${book} ${chapterNum} yet`); return; }
        const total = parseInt(box.dataset.count);
        askConfirm(
          `Clear ${book} ${chapterNum}?`,
          `${readCount} of ${total} verses will be marked unread. Your notes and saved verses are not affected.`,
          () => {
            const n = clearChapterProgress(book, chapterNum);
            openBookDetail(book);
            showToast(`${book} ${chapterNum} marked unread (${n} verses)`);
          },
          'Clear');
      };
    });
  }

  // ---------- My notes browser ----------

  function openNotesBrowser() {
    setTrayActive('notes');
    setHomeTitle('Notes');
    const drawer = document.getElementById('home-content');
    const byBook = {};
    const seenStarts = new Set();
    Object.keys(notes).forEach(key => {
      const entry = getNoteEntry(key);
      if (!entry) return;
      const signature = `${entry.startKey}`;
      if (seenStarts.has(signature)) return;
      seenStarts.add(signature);
      const parts = entry.startKey.split(':');
      const book = parts[0];
      const startC = parseInt(parts[1]), startV = parseInt(parts[2]);
      const arr = BOOK_VERSES[book];
      let endC = startC, endV = startV;
      let verseText = '';
      if (arr) {
        const startIdx = arr.findIndex(x => x.c === startC && x.v === startV);
        if (startIdx >= 0) {
          const chunk = arr.slice(startIdx, startIdx + entry.span);
          verseText = chunk.map(x => x.kjv).join(' ');
          const endVerse = chunk[chunk.length - 1];
          if (endVerse) { endC = endVerse.c; endV = endVerse.v; }
        }
      }
      byBook[book] = byBook[book] || [];
      byBook[book].push({ startC, startV, endC, endV, span: entry.span, text: entry.text, verseText });
    });
    Object.keys(byBook).forEach(b => byBook[b].sort((a, b2) => a.startC - b2.startC || a.startV - b2.startV));

    let html = `<button class="back-btn" id="notes-back">‹ Back to home</button>`;
    const books = Object.keys(byBook);
    if (books.length === 0) {
      html += `<p class="study-body" style="text-align:center;">No notes yet. Tap the note icon on any verse to add one.</p>`;
    } else {
      html += filterSelectHtml('notes', books, byBook);
      const shown = listFilter.notes === 'all' ? books : books.filter(b => b === listFilter.notes);
      shown.forEach(book => {
        html += `<p style="font-size:13px; font-weight:500; color:var(--accent); margin:18px 0 6px;">${book} <span style="color:var(--text-secondary); font-weight:400;">(${byBook[book].length})</span></p>`;
        byBook[book].forEach(n => {
          const refLabel = n.span > 1 ? `${book} ${n.startC}:${n.startV} – ${n.endC}:${n.endV}` : `${book} ${n.startC}:${n.startV}`;
          const versePreview = n.verseText ? (n.verseText.length > 100 ? n.verseText.slice(0, 100) + '…' : n.verseText) : '';
          html += `<div class="search-result list-row" data-book="${book}" data-c="${n.startC}" data-v="${n.startV}">
            <div class="sr-ref">${refLabel}</div>
            ${versePreview ? `<div style="font-family:Georgia,serif; font-size:13px; color:var(--text-secondary); font-style:italic; margin:4px 0 6px;">"${versePreview}"</div>` : ''}
            <div class="sr-text">${n.text.length > 90 ? n.text.slice(0, 90) + '…' : n.text}</div>
            <button class="row-del" data-del="${book}:${n.startC}:${n.startV}" data-ref="${refLabel}" aria-label="Delete note">&times;</button>
          </div>`;
        });
      });
    }
    drawer.innerHTML = html;
    document.getElementById('notes-back').onclick = () => openHome();
    wireFilter('notes', openNotesBrowser);
    drawer.querySelectorAll('.row-del').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        askConfirm('Delete this note?', 'Your note on ' + btn.dataset.ref + ' will be deleted. This cannot be undone.', () => {
          deleteNoteAt(btn.dataset.del);
          openNotesBrowser();
          showToast('Note deleted');
        });
      };
    });
    drawer.querySelectorAll('.search-result').forEach(el => {
      el.onclick = () => {
        const c = parseInt(el.dataset.c), v = parseInt(el.dataset.v);
        hideHomePage();
        switchToBook(el.dataset.book, c, v);
      };
    });
  }

  // ---------- Search ----------
  document.getElementById('search-btn').onclick = () => {
    openDrawer('search-overlay');
    document.getElementById('search-input').placeholder = `Search ${state.book}, e.g. 1:5 or wisdom`;
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
    setTimeout(() => document.getElementById('search-input').focus(), 100);
  };

  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    const results = document.getElementById('search-results');
    results.innerHTML = '';
    if (!q) return;

    const refMatch = q.match(/^(?:\w+\s*)?(\d+)[:\s]*(\d+)?$/);
    let matches = [];
    if (refMatch) {
      const c = parseInt(refMatch[1]);
      const vnum = refMatch[2] ? parseInt(refMatch[2]) : null;
      matches = state.verses.filter(v => v.c === c && (vnum === null || v.v === vnum));
    } else {
      matches = state.verses.filter(v => v.kjv.toLowerCase().includes(q) || v.web.toLowerCase().includes(q));
    }
    matches.slice(0, 25).forEach(v => {
      const div = document.createElement('div');
      div.className = 'search-result';
      div.innerHTML = `<div class="sr-ref">${state.book} ${v.c}:${v.v}</div><div class="sr-text">${v.kjv}</div>`;
      div.onclick = () => {
        closeDrawer('search-overlay');
        goToChapter(v.c, v.v);
      };
      results.appendChild(div);
    });
  });

  // ---------- Init ----------
  renderFeed();
  setTimeout(() => { updateThumbFromScroll(); positionBounds(); refreshRailState(); }, 100);
  window.addEventListener('resize', positionBounds);
  feed.addEventListener('scroll', () => setTimeout(refreshRailState, 90));
  openHome();
  document.getElementById('home-page').style.transition = 'none';
  requestAnimationFrame(() => { document.getElementById('home-page').style.transition = ''; });

})();
</script>
</body>
</html>
