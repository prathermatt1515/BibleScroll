<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bible Scroll</title>
<meta name="description" content="The whole Bible, one verse at a time — with commentary, the original Hebrew and Greek, and cross references you can follow.">
<link rel="icon" href="cross.png">
<link rel="apple-touch-icon" href="cross.png">
<meta name="apple-mobile-web-app-title" content="Bible Scroll">

<!-- Shared links showed the page title, which still named the one book the
     app started with, beside a generic browser icon. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bible Scroll">
<meta property="og:title" content="Bible Scroll">
<meta property="og:description" content="The whole Bible, one verse at a time — with commentary, the original Hebrew and Greek, and cross references you can follow.">
<meta property="og:url" content="https://prathermatt1515.github.io/BibleScroll/">
<meta property="og:image" content="https://prathermatt1515.github.io/BibleScroll/cross.png">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #121212;
    --bg-card: #1a1a1a;
    --bg-pill: #1f1f1f;
    --text-primary: #f5f5f0;
    --text-secondary: #8a8a85;
    --text-tertiary: #5c5c58;
    --accent: #c9a37a;
    --accent-dim: #8B5A3C;
    --study-bg: #241d16;
    --border: #2a2a2a;
    --border-strong: #45443f;
  }
  [data-theme="light"] {
    --bg: #FAF9F6;
    --bg-card: #ffffff;
    --bg-pill: #eeece6;
    --text-primary: #1A1A1A;
    --text-secondary: #6B6B66;
    --text-tertiary: #a3a39c;
    --accent: #8B5A3C;
    --accent-dim: #8B5A3C;
    --study-bg: #f3ece3;
    --border: #e3e0d8;
    --border-strong: #c9c5ba;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  /* Height of the bottom tray, plus the iPhone home-indicator inset so the
     labels are not sitting under it. */
  :root, [data-theme="light"] { --tray-h: calc(58px + env(safe-area-inset-bottom, 0px)); }
  #app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }

  /* Top bar */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 16px 0;
  }
  .pill {
    background: var(--bg-pill); border-radius: 999px; padding: 7px 14px;
    font-size: 13px; color: var(--text-primary); border: none;
    display: flex; align-items: center; gap: 4px; cursor: pointer;
  }
  #search-btn {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--bg-pill); border-radius: 999px; width: 34px; height: 34px;
    border: none; color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 21;
  }

  /* Feed */
  #feed {
    height: calc(100% - var(--tray-h)); overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }
  #feed::-webkit-scrollbar { display: none; }
  .verse-page {
    height: 100%; scroll-snap-align: start;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 46px; position: relative;
  }
  .verse-icon {
    width: 68px; height: 68px; margin-bottom: 28px; opacity: 0.92;
    object-fit: contain;
  }
  .verse-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px; line-height: 1.65; text-align: center; color: var(--text-primary);
    max-width: 520px;
  }
  .verse-ref {
    font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 16px;
    cursor: pointer;
  }
  .note-indicator {
    display: flex; align-items: center; gap: 5px; justify-content: center;
    font-size: 11px; color: var(--accent); margin-top: 10px;
  }
  .note-indicator svg { width: 8px; height: 8px; }
  .next-chapter-hint {
    font-size: 12px; color: var(--text-tertiary); text-align: center; margin-top: 26px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .next-chapter-hint svg { width: 16px; height: 16px; animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(5px); opacity: 1; } }
  @keyframes chapterFadePulse {
    0% { opacity: 0; transform: scale(0.96); }
    45% { opacity: 1; transform: scale(1); }
    68% { transform: scale(1.035); }
    100% { opacity: 1; transform: scale(1); }
  }
  .verse-page.chapter-pulse .verse-text,
  .verse-page.chapter-pulse .verse-icon,
  .verse-page.chapter-pulse .verse-ref {
    animation: chapterFadePulse 0.9s ease-out;
  }
  .chapter-badge {
    display: inline-block; font-size: 11px; color: var(--accent); letter-spacing: 0.04em;
    background: var(--study-bg); padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
    opacity: 0; transition: opacity 0.6s ease-out;
  }
  .verse-page.chapter-pulse .chapter-badge { opacity: 1; }

  /* Left scrollbar */
  #scrollbar-track {
    position: absolute; left: 4px; top: 92px; bottom: calc(100px + var(--tray-h)); width: 24px;
    z-index: 15; display: flex; flex-direction: column; justify-content: space-between;
    touch-action: none; padding: 0 10px; box-sizing: content-box;
  }
  .tick { width: 4px; height: 2px; background: var(--border); border-radius: 1px; }
  #scrollbar-thumb {
    position: absolute; left: 18px; width: 10px; height: 30px;
    background: var(--accent-dim); border-radius: 5px; z-index: 16;
    touch-action: none; transition: width 0.15s, height 0.15s, left 0.15s, border-radius 0.15s;
  }
  #scrollbar-thumb.dragging {
    width: 16px; height: 46px; left: 15px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #scrollbar-label {
    position: absolute; left: 30px; z-index: 17;
    background: var(--bg-pill); color: var(--text-primary); font-size: 13px; font-weight: 500;
    padding: 4px 9px; border-radius: 999px; opacity: 0; transition: opacity 0.15s;
    pointer-events: none; white-space: nowrap;
  }
  #scrollbar-label.show { opacity: 1; }
  .scrollbar-bound {
    position: absolute; left: 18px; font-size: 11px; color: var(--text-tertiary); z-index: 14;
  }

  /* Right icon rail */
  #icon-rail {
    position: absolute; right: 14px; top: calc(50% - var(--tray-h) / 2); transform: translateY(-10%);
    z-index: 15; display: flex; flex-direction: column; gap: 24px; align-items: center;
  }
  .rail-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; }
  .rail-btn.active { color: var(--accent); }
  .rail-btn svg { width: 22px; height: 22px; display: block; }

  /* Bottom-left theme toggle */
  #theme-toggle {
    position: absolute; bottom: calc(20px + var(--tray-h)); left: 16px; z-index: 15;
    background: var(--bg-pill); border: none; border-radius: 999px;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); cursor: pointer;
  }

  /* Drawer (deep study, search, note) */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .drawer-overlay.open { display: flex; }
  .drawer {
    background: var(--bg-card); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 14px 20px 28px;
    max-height: 82vh; overflow-y: auto;
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
  .drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; cursor: grab; touch-action: none; padding: 10px 30px; background-clip: content-box; box-sizing: content-box; margin-top: -10px; }
  .drawer-ref { font-size: 12px; color: var(--text-secondary); text-align: center; margin: 0 0 2px; }
  .drawer-verse { font-family: Georgia, serif; font-size: 15px; color: var(--text-primary); text-align: center; margin: 0 0 18px; line-height: 1.5; }

  .menu-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 4px;
    border-bottom: 0.5px solid var(--border); cursor: pointer; background: none; border-left: none; border-right: none; border-top: none;
    width: 100%; text-align: left; color: var(--text-primary); font-size: 14px; font-family: inherit;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  .back-btn {
    background: var(--bg-pill); border: none; border-radius: 999px; padding: 6px 14px;
    font-size: 13px; color: var(--text-primary); display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer; margin-bottom: 14px;
  }
  .study-title { font-size: 13px; font-weight: 500; text-align: center; margin: 0 0 2px; color: var(--text-primary); }
  .study-body { font-size: 14px; line-height: 1.65; color: var(--text-secondary); margin: 14px 0; }
  .study-body strong, .study-body b { color: var(--text-primary); }
  .study-body em, .study-body i { color: var(--accent); font-style: normal; }
  .study-card {
    background: var(--study-bg); border-radius: 10px; padding: 13px 15px; margin-bottom: 10px;
  }
  .study-card-label {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    font-size: 11px; color: var(--accent); letter-spacing: 0.03em; font-weight: 500;
  }
  .study-card p { font-size: 13px; color: var(--text-primary); margin: 0; line-height: 1.5; }
  .greek-word { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 0.5px solid var(--border); }
  .greek-word:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
  .greek-orig { font-size: 18px; color: var(--accent); margin-bottom: 2px; }
  .greek-meaning { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .study-source {
    margin: 10px 0 0; font-size: 11px; line-height: 1.5;
    color: var(--text-tertiary); font-style: italic;
  }
  .related-link.available { cursor: pointer; color: var(--text-primary); }
  .related-link.available:active { background: var(--bg-pill); }
  .related-link.unavailable { color: var(--text-tertiary); cursor: default; }
  .related-link .rl-note { float: right; font-size: 11px; color: var(--text-tertiary); }
  .related-link {
    display: block; padding: 10px 4px; border-bottom: 0.5px solid var(--border);
    font-size: 14px; color: var(--text-primary); cursor: pointer;
  }
  .related-link:last-child { border-bottom: none; }

  .bottom-row {
    display: flex; justify-content: space-around; border-top: 0.5px solid var(--border);
    padding-top: 14px; margin-top: 4px;
  }
  .bottom-row button { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; }
  .bottom-row button.active { color: var(--accent); }
  .bottom-row svg { width: 18px; height: 18px; display: block; }

  /* Search drawer */
  #search-input {
    width: 100%; background: var(--bg-pill); border: none; border-radius: 10px;
    padding: 12px 14px; font-size: 15px; color: var(--text-primary); margin-bottom: 14px; font-family: inherit;
  }
  #search-input:focus { outline: 1px solid var(--accent-dim); }
  .search-result {
    padding: 10px 4px; border-bottom: 0.5px solid var(--border); cursor: pointer;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result .sr-ref { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; }
  .search-result .sr-text { font-size: 14px; color: var(--text-primary); }

  /* Arriving in a new chapter */
  #chapter-flash {
    position: fixed; inset: 0; z-index: 140; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
  }
  #chapter-flash.show { display: flex; }
  /* A near-solid backdrop. A translucent one let the verse text show through
     and collide with the numeral, which made the moment read as a glitch
     rather than an arrival. */
  #chapter-flash::before {
    content: ''; position: absolute; inset: 0; background: var(--bg);
    animation: cf-veil 1.9s ease-out forwards;
  }
  #chapter-flash::after {
    content: ''; position: absolute; left: 50%; top: 46%; width: 320px; height: 320px;
    transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(circle, rgba(201,163,122,0.14) 0%, rgba(201,163,122,0) 68%);
    animation: cf-veil 1.9s ease-out forwards;
  }
  .cf-book {
    position: relative; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 6px; animation: cf-in 1.9s ease-out forwards;
  }
  .cf-num {
    position: relative; font-family: Georgia, serif; font-size: 84px; line-height: 1;
    color: var(--text-primary); margin: 0; animation: cf-num 1.9s cubic-bezier(.2,.9,.25,1) forwards;
  }
  .cf-rule {
    position: relative; width: 0; height: 1px; background: var(--accent);
    margin: 16px 0 14px; animation: cf-rule 1.9s ease-out forwards;
  }
  .cf-sub {
    position: relative; font-size: 13px; color: var(--text-secondary);
    margin: 0; animation: cf-in 1.9s ease-out 0.1s forwards; opacity: 0;
  }
  .cf-sub.done { color: var(--accent); }
  @keyframes cf-veil { 0% { opacity: 0; } 16% { opacity: 1; } 72% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes cf-in   { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; transform: none; }
                       74% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes cf-num  { 0% { opacity: 0; transform: scale(0.82); } 22% { opacity: 1; transform: scale(1); }
                       34% { transform: scale(1.06); } 48% { transform: scale(1); }
                       74% { opacity: 1; } 100% { opacity: 0; transform: scale(1.02); } }
  @keyframes cf-rule { 0% { width: 0; opacity: 0; } 26% { width: 54px; opacity: 1; }
                       74% { width: 54px; opacity: 1; } 100% { width: 54px; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #chapter-flash::before, .cf-book, .cf-num, .cf-rule, .cf-sub { animation-duration: 1.2s; }
    @keyframes cf-num { 0% { opacity: 0; } 20% { opacity: 1; } 74% { opacity: 1; } 100% { opacity: 0; } }
  }

  /* Opening screen */  /* Opening screen */
  #splash {
    position: fixed; inset: 0; z-index: 190;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; background: var(--bg); text-align: center;
    transition: opacity 0.6s ease;
  }
  #splash.fading { opacity: 0; pointer-events: none; }
  #splash.done { display: none; }
  #splash img {
    width: 116px; height: 116px; object-fit: contain; margin-bottom: 34px;
    animation: splash-rise 0.9s ease both;
  }
  #splash-welcome {
    font-family: Georgia, serif; color: var(--text-primary);
    font-size: clamp(28px, 8.2vw, 38px); line-height: 1.25;
    margin: 0 0 18px; animation: splash-rise 0.9s ease 0.15s both;
  }
  #splash-line {
    font-family: Georgia, serif; color: var(--text-secondary);
    font-size: clamp(17px, 4.8vw, 22px); line-height: 1.6;
    max-width: 19ch; margin: 0; animation: splash-rise 0.9s ease 0.3s both;
  }
  /* It waits for a tap now, so it has to say so. */
  #splash-hint {
    position: absolute; bottom: calc(46px + env(safe-area-inset-bottom, 0px));
    font-size: 13px; letter-spacing: 0.4px; color: var(--text-tertiary);
    margin: 0; opacity: 0; animation: splash-hint 1s ease 1.4s forwards;
  }
  @keyframes splash-hint { to { opacity: 1; } }
  @keyframes splash-rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash img, #splash-welcome, #splash-line { animation: none; }
    #splash-hint { animation: none; opacity: 1; }
    #splash { transition: none; }
  }

  /* Bottom tray */  /* Bottom tray */
  #bottom-tray {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--tray-h);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; align-items: stretch;
    background: var(--bg); border-top: 0.5px solid var(--border);
    /* Above the home page (150), which the Notes and Saved lists live inside,
       so the tray stays put when you move between them. */
    z-index: 160;
  }
  /* A drawer dims the screen, so the tray steps out of the way rather than
     floating over the dimming. */
  body:has(.drawer-overlay.open) #bottom-tray { display: none; }
  .tray-btn {
    flex: 1; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 0 4px; color: var(--text-tertiary);
    font-family: inherit; font-size: 10px; letter-spacing: 0.2px;
  }
  .tray-btn svg { width: 21px; height: 21px; display: block; }
  .tray-btn.active { color: var(--text-primary); }
  .tray-btn.active svg { stroke: var(--accent); }

  /* Rows in the Notes and Saved lists carry a delete button */
  .list-row { position: relative; padding-right: 34px; }
  .row-del {
    position: absolute; top: 8px; right: 0;
    width: 26px; height: 26px; padding: 0; border: none; border-radius: 50%;
    background: transparent; color: var(--text-tertiary);
    font-size: 17px; line-height: 26px; text-align: center; cursor: pointer;
  }
  .row-del:hover, .row-del:active { background: var(--bg-pill); color: var(--text-primary); }

  /* Book filter above a list */
  .list-filter {
    width: 100%; margin: 4px 0 2px; padding: 9px 12px;
    background: var(--bg-pill); color: var(--text-primary);
    border: 0.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; -webkit-appearance: none; appearance: none;
  }

  /* Confirm dialog */
  #confirm-overlay {
    /* Above the home page (150), which hosts the Notes and Saved lists the
       delete buttons live in, but below the toast (200). */
    position: fixed; inset: 0; z-index: 180; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(0,0,0,0.55);
  }
  #confirm-overlay.open { display: flex; }
  .confirm-card {
    width: 100%; max-width: 320px; background: var(--bg-card);
    border: 0.5px solid var(--border); border-radius: 16px; padding: 20px;
    text-align: center;
  }
  .confirm-title { font-size: 16px; color: var(--text-primary); margin: 0 0 6px; }
  .confirm-body { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions button {
    flex: 1; padding: 11px 0; border-radius: 10px; font-size: 14px;
    font-family: inherit; cursor: pointer; border: 0.5px solid var(--border);
  }
  #confirm-cancel { background: var(--bg-pill); color: var(--text-primary); }
  #confirm-ok { background: #8B3A3A; color: #fff; border-color: #8B3A3A; }

  /* Note textarea */
  #note-textarea {
    width: 100%; min-height: 120px; background: var(--bg-pill); border: none; border-radius: 10px;
    padding: 12px 14px; font-size: 14px; color: var(--text-primary); font-family: inherit; resize: vertical;
    margin-bottom: 14px;
  }
  #note-textarea:focus { outline: 1px solid var(--accent-dim); }
  .save-note-btn {
    width: 100%; background: var(--accent-dim); border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; color: #fff; cursor: pointer; font-family: inherit;
  }

  .loading-dots { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 20px 0; }

  /* Home full page */
  #home-page {
    position: fixed; inset: 0; background: var(--bg); z-index: 150;
    transform: translateY(100%); transition: transform 0.28s ease-out;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #home-page.open { transform: translateY(0); }
  #home-page-header {
    position: sticky; top: 0; background: var(--bg); z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 12px; border-bottom: 0.5px solid var(--border);
  }
  #home-page-title { font-size: 17px; font-weight: 500; color: var(--text-primary); }
  #home-close-btn {
    background: var(--bg-pill); border: none; border-radius: 999px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer;
  }
  #home-close-btn svg { width: 15px; height: 15px; }
  /* Bottom padding keeps the last row clear of the tray. */
  #home-content { padding: 20px 20px calc(20px + var(--tray-h)); }

  /* Home / tracker */
  .home-title { font-size: 18px; font-weight: 500; text-align: center; margin: 0 0 18px; color: var(--text-primary); }
  .home-logo { display: block; width: 84px; height: 84px; margin: 4px auto 22px; object-fit: contain; }
  .tracker-card {
    background: var(--bg-card); border: 0.5px solid var(--border-strong); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
  }
  .streak-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .streak-flame {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #f5a742, #d8542b);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .streak-flame svg { width: 22px; height: 22px; color: #fff; }
  .streak-num { font-size: 26px; font-weight: 500; color: var(--text-primary); line-height: 1.1; }
  .streak-label { font-size: 11px; color: var(--text-secondary); letter-spacing: 0.04em; }
  .days-row { display: flex; justify-content: space-between; }
  .day-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day-letter { font-size: 11px; color: var(--text-secondary); }
  .day-dot {
    width: 26px; height: 26px; border-radius: 50%; background: var(--bg-pill);
    border: 0.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
  }
  .day-dot.filled { background: linear-gradient(135deg, #f5a742, #d8542b); border-color: transparent; }
  .day-dot svg { width: 13px; height: 13px; color: #fff; }

  .account-row {
    display: flex; align-items: center; gap: 12px; background: var(--bg-card);
    border: 0.5px solid var(--border-strong); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
  }
  .account-avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  }
  .account-avatar-fallback {
    background: var(--bg-pill); display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 500; color: var(--text-primary);
  }
  .account-info { flex: 1; min-width: 0; }
  .account-sub-warn { color: #e29b9a; }
  .build-stamp {
    text-align: center; font-size: 10px; color: var(--text-tertiary);
    margin: 22px 0 0; letter-spacing: 0.3px;
  }
  .account-name { font-size: 14px; font-weight: 500; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; }
  .account-signout-btn {
    background: var(--bg-pill); border: 0.5px solid var(--border-strong); border-radius: 999px;
    padding: 7px 14px; font-size: 12px; color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
  }

  .library-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 0.5px solid var(--border); cursor: pointer;
  }
  .library-icon {
    width: 40px; height: 40px; border-radius: 50%; background: var(--bg-pill);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-primary);
  }
  .library-icon svg { width: 18px; height: 18px; }
  .library-text { flex: 1; }
  .library-title { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .library-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .library-chevron { color: var(--text-tertiary); flex-shrink: 0; }
  .library-chevron svg { width: 16px; height: 16px; }

  /* Book and chapter picker. The pill is labelled with a chapter number, so
     the sheet it opens has to be able to set one; a book expands its chapters
     in place rather than sending you elsewhere to find them. */
  .picker-testament {
    /* Sticks 14px high to cover the drawer's own top padding: content
       scrolling through that strip would otherwise appear above the header. */
    position: sticky; top: -14px; z-index: 2; background: var(--bg-card);
    font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-tertiary); padding: 26px 4px 7px;
    border-bottom: 0.5px solid var(--border);
  }
  .picker-book { justify-content: space-between; }
  .picker-book.open { color: var(--accent); }
  .picker-note { font-size: 11px; color: var(--accent); margin-left: auto; }
  .picker-caret {
    font-size: 10px; color: var(--text-tertiary); flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .picker-book.open .picker-caret { transform: rotate(180deg); color: var(--accent); }
  .picker-chapters {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    padding: 12px 2px 16px; border-bottom: 0.5px solid var(--border);
  }

  /* Section heads for the Home book list. Not sticky, unlike the picker's:
     #home-page already has a sticky header bar at top 0 and two of them would
     fight for the same strip. */
  /* Borrows the chapter flash's veil and timing so an earned badge arrives
     the same way a new chapter does, at a size a name can actually sit at. */
  #badge-flash {
    position: fixed; inset: 0; z-index: 141; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center; padding: 0 32px;
  }
  #badge-flash.show { display: flex; }
  #badge-flash::before {
    content: ''; position: absolute; inset: 0; background: var(--bg);
    animation: cf-veil 2.2s ease-out forwards;
  }
  #badge-flash::after {
    content: ''; position: absolute; left: 50%; top: 46%; width: 320px; height: 320px;
    transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(circle, rgba(201,163,122,0.16) 0%, rgba(201,163,122,0) 68%);
    animation: cf-veil 2.2s ease-out forwards;
  }
  .bf-label {
    position: relative; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px; animation: cf-in 2.2s ease-out forwards;
  }
  .bf-name {
    position: relative; font-family: Georgia, serif; font-size: 32px; line-height: 1.2;
    color: var(--text-primary); margin: 0; animation: cf-num 2.2s cubic-bezier(.2,.9,.25,1) forwards;
  }
  .bf-note {
    position: relative; font-size: 13px; color: var(--text-secondary); margin: 0;
    animation: cf-in 2.2s ease-out forwards;
  }

  /* Badge grid on Home. Unearned badges stay legible rather than hidden, so
     the list reads as somewhere to go rather than a locked cabinet. */
  .badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
  .badge-card {
    background: var(--bg-pill); border: 0.5px solid var(--border);
    border-radius: 10px; padding: 11px 12px;
  }
  .badge-card.earned { border-color: var(--accent-dim); background: var(--bg-card); }
  .badge-name { font-size: 13px; color: var(--text-secondary); margin: 0 0 3px; }
  .badge-card.earned .badge-name { color: var(--text-primary); }
  .badge-note { font-size: 11px; color: var(--text-tertiary); margin: 0; line-height: 1.35; }
  .badge-count { font-size: 11px; color: var(--text-secondary); margin: 0 0 8px; }

  /* Following a related verse changes book and chapter, and without this
     there is no way back to the verse that sent you. Sits above the tray and
     under the Home sheet, so it disappears on its own when Home is open. */
  #return-pill {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--tray-h) + 14px); z-index: 140;
    display: none; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px;
    background: var(--bg-pill); color: var(--text-primary);
    border: 0.5px solid var(--border-strong);
    font-size: 13px; font-family: inherit; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    animation: returnRise 0.22s ease-out;
  }
  #return-pill.show { display: inline-flex; }
  /* "Back to 1 Thessalonians 5:23" would reach the theme button on a narrow
     phone, so the label gives way rather than the pill growing into it. */
  #return-pill { max-width: calc(100vw - 130px); }
  #return-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #return-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
  @keyframes returnRise { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (prefers-reduced-motion: reduce) { #return-pill { animation: none; } }

  .book-section {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    margin: 22px 0 4px;
  }
  .book-section:first-of-type { margin-top: 20px; }

  .book-row {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 4px;
    border-bottom: 0.5px solid var(--border); cursor: pointer;
  }
  .book-row.disabled { opacity: 0.4; cursor: default; }
  .book-name { font-size: 14px; color: var(--text-primary); }
  .book-progress-wrap { display: flex; align-items: center; gap: 8px; }
  .book-progress-track { width: 60px; height: 4px; background: var(--bg-pill); border-radius: 2px; overflow: hidden; }
  .book-progress-fill { height: 100%; background: var(--accent-dim); }
  .book-pct { font-size: 11px; color: var(--text-secondary); min-width: 30px; text-align: right; }

  .chapter-group-label { font-size: 12px; font-weight: 500; color: var(--accent); margin: 18px 0 8px; }
  .verse-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .verse-box {
    aspect-ratio: 1; border-radius: 6px; background: var(--bg-pill);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-secondary); cursor: pointer;
  }
  .verse-box.read { background: var(--accent-dim); color: #fff; }
  /* Part-read chapters are otherwise invisible on this grid, which matters
     when you are looking for something to clear. */
  .verse-box.partial { box-shadow: inset 0 0 0 1.5px var(--accent-dim); }
  .verse-grid.clearing .verse-box.has-read { background: #8B3A3A; color: #fff; box-shadow: none; }
  .verse-grid.clearing .verse-box:not(.has-read) { opacity: 0.35; }
  .clear-toggle {
    display: block; margin: 18px auto 0; padding: 9px 18px;
    background: var(--bg-pill); color: var(--text-secondary);
    border: 0.5px solid var(--border); border-radius: 999px;
    font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .clear-toggle.active { color: #e29b9a; border-color: #8B3A3A; }
  .clear-hint { text-align: center; font-size: 12px; color: var(--text-secondary); margin: 10px 0 0; line-height: 1.5; }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--bg-pill); color: var(--text-primary); padding: 10px 18px;
    border-radius: 999px; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }

  #screenshot-canvas-holder { position: fixed; top: -9999px; left: -9999px; }
</style>
</head>

    sun: '<circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
  };
  function renderThemeIcon() {
    document.getElementById('theme-icon').innerHTML = state.theme === 'dark' ? ICONS.sun : ICONS.moon;
  }
  renderThemeIcon();

  // ---------- Feed rendering ----------
  const feed = document.getElementById('feed');

  function offlineText(v, trans) {
    return v[trans] || v.kjv;
  }

  function renderFeed() {
    feed.innerHTML = '';
    state.verses.forEach((v, idx) => {
      const page = document.createElement('div');
      page.className = 'verse-page';
      page.dataset.index = idx;
      const iconEl = document.createElement('img');
      iconEl.src = 'cross.png';
      iconEl.className = 'verse-icon';
      iconEl.alt = 'Open deep study';
      iconEl.style.cursor = 'pointer';
      iconEl.onclick = () => openStudy(idx);
      page.appendChild(iconEl);
      const textEl = document.createElement('p');
      textEl.className = 'verse-text';
      textEl.id = `vtext-${idx}`;
      textEl.textContent = '…';
      const refEl = document.createElement('p');
      refEl.className = 'verse-ref';
      refEl.textContent = `${state.book} ${v.c}:${v.v}`;
      refEl.onclick = () => openStudy(idx);
      page.appendChild(textEl);
      page.appendChild(refEl);

      const noteKey = `${state.book}:${v.c}:${v.v}`;
      if (notes[noteKey]) {
        const dot = document.createElement('span');
        dot.className = 'note-indicator';
        dot.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="4"/></svg> has a note';
        dot.style.cursor = 'pointer';
        dot.onclick = () => openNoteEditor(idx);
        page.appendChild(dot);
      }

      const next = state.verses[idx + 1];
      const isFirstOfChapter = idx > 0 && v.v === 1;
      const isLastOfChapter = next && next.c !== v.c;

      if (isFirstOfChapter) {
        const badge = document.createElement('div');
        badge.className = 'chapter-badge';
        badge.textContent = `${state.book.toUpperCase()} ${v.c}`;
        page.insertBefore(badge, page.firstChild);
      }
      if (isLastOfChapter) {
        const hint = document.createElement('div');
        hint.className = 'next-chapter-hint';
        hint.innerHTML = `<span>${state.book} ${next.c} next</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12l-7 7-7-7M12 19V5"/></svg>`;
        page.appendChild(hint);
      }
      feed.appendChild(page);
    });
    loadVisibleText();
    updateChapterLabel();
    buildTicks();
  }

  // ---------- Cross-book loading and navigation ----------
  function ensureBookLoaded(book, callback) {
    if (BOOK_VERSES[book]) { callback(); return; }
    showToast(`Loading ${book}…`);
    const fileName = BOOK_FILE_NAMES[book] || book;
    Promise.all([
      fetch(`data/verses_${fileName}.json`).then(r => r.json()),
      fetch(`data/study_${fileName}.json`).then(r => r.json())
    ]).then(([verses, study]) => {
      BOOK_VERSES[book] = verses;
      BOOK_STUDY[book] = study;
      callback();
    }).catch(() => showToast('Could not load ' + book));
  }

  // Choosing a book or chapter yourself ends the trail: a pill offering to go
  // back somewhere you deliberately left is noise. Only a cross-reference,
  // which moves you without being asked to, keeps it.
  function switchToBook(book, chapterNum, verseNum, opts) {
    const keepTrail = !!(opts && opts.keepTrail);
    ensureBookLoaded(book, () => {
      if (!keepTrail) clearRefTrail();
      suspendRead();
      state.book = book;
      state.chapter = chapterNum || 1;
      state.verses = BOOK_VERSES[book];
      renderFeed();
      const idx = state.verses.findIndex(v => v.c === (chapterNum || 1) && v.v === (verseNum || 1));
      feed.scrollTop = 0;
      if (idx > 0) {
        setTimeout(() => { feed.scrollTo({ top: idx * feed.clientHeight, behavior: 'auto' }); loadVisibleText(); updateThumbFromScroll(); refreshRailState(); }, 30);
      }
      setTimeout(() => { updateThumbFromScroll(); positionBounds(); refreshRailState(); resumeRead(); }, 60);
    });
  }

  function goToChapter(c, verseNum) {
    if (c < 1 || c > CHAPTER_COUNTS[state.book].length) return;
    const idx = state.verses.findIndex(v => v.c === c && v.v === (verseNum || 1));
    if (idx < 0) return;
    suspendRead();
    feed.scrollTo({ top: idx * feed.clientHeight, behavior: 'auto' });
    setTimeout(() => { loadVisibleText(); updateChapterLabel(); updateThumbFromScroll(); refreshRailState(); resumeRead(); }, 60);
  }

  async function getVerseText(idx) {
    const v = state.verses[idx];
    if (state.translation === 'kjv' || state.translation === 'web') {
      return offlineText(v, state.translation);
    }
    const cacheKey = `${state.translation}:${state.book}:${v.c}:${v.v}`;
    if (state.liveTextCache[cacheKey]) return state.liveTextCache[cacheKey];
    try {
      const text = await fetchLiveVerse(v.c, v.v, state.translation);
      state.liveTextCache[cacheKey] = text;
      localStorage.setItem('sj_livecache', JSON.stringify(state.liveTextCache));
      return text;
    } catch (e) {
      return v.kjv + '  (offline fallback — could not reach translation service)';
    }
  }

  async function resolveBibleIds() {
    if (bibleIds) return bibleIds;
    const res = await fetch('https://api.scripture.api.bible/v1/bibles', {
      headers: { 'api-key': API_BIBLE_KEY }
    });
    const json = await res.json();
    const ids = {};
    (json.data || []).forEach(b => {
      const abbr = (b.abbreviationLocal || b.abbreviation || '').toUpperCase();
      if (abbr.includes('NIV') && !ids.niv) ids.niv = b.id;
      if (abbr.includes('NLT') && !ids.nlt) ids.nlt = b.id;
    });
    bibleIds = ids;
    localStorage.setItem(BIBLE_ID_CACHE_KEY, JSON.stringify(ids));
    return ids;
  }

  async function fetchLiveVerse(chapter, verse, trans) {
    const ids = await resolveBibleIds();
    const bibleId = ids[trans];
    if (!bibleId) throw new Error('No bible id for ' + trans);
    const verseId = `${BOOK_CODES[state.book]}.${chapter}.${verse}`;
    const res = await fetch(`https://api.scripture.api.bible/v1/bibles/${bibleId}/verses/${verseId}?content-type=text&include-notes=false&include-titles=false&include-chapter-numbers=false&include-verse-numbers=false&include-verse-spans=false`, {
      headers: { 'api-key': API_BIBLE_KEY }
    });
    const json = await res.json();
    return (json.data && json.data.content ? json.data.content.trim() : '(unavailable)');
  }

  async function loadVisibleText() {
    const idx = currentIndex();
    for (let i = Math.max(0, idx - 1); i <= Math.min(state.verses.length - 1, idx + 1); i++) {
      const el = document.getElementById(`vtext-${i}`);
      if (el && el.textContent === '…') {
        getVerseText(i).then(t => { if (el) el.textContent = t; });
      }
    }
  }

  function currentIndex() {
    const scrollTop = feed.scrollTop;
    const h = feed.clientHeight;
    return Math.round(scrollTop / h);
  }

  let lastSeenChapter = 1;
  // Reaching a new chapter is the beat the whole feed builds toward, and it
  // was passing with an 11px badge. This marks it: the numeral arrives, and
  // the line underneath says either that the chapter behind you is finished
  // or how far through the book you are.
  function chapterIsRead(book, chapter) {
    const counts = CHAPTER_COUNTS[book];
    if (!counts || !counts[chapter - 1]) return false;
    for (let v = 1; v <= counts[chapter - 1]; v++) {
      if (!readVerses[`${book}:${chapter}:${v}`]) return false;
    }
    return true;
  }

  function chaptersReadIn(book) {
    const counts = CHAPTER_COUNTS[book];
    if (!counts) return 0;
    let n = 0;
    for (let c = 1; c <= counts.length; c++) if (chapterIsRead(book, c)) n++;
    return n;
  }

  let chapterFlashTimer = null;
  function showChapterFlash(chapter, prevChapter) {
    const el = document.getElementById('chapter-flash');
    const counts = CHAPTER_COUNTS[state.book] || [];
    const finished = prevChapter && prevChapter !== chapter && chapterIsRead(state.book, prevChapter);

    document.getElementById('cf-book').textContent = state.book;
    document.getElementById('cf-num').textContent = chapter;
    const sub = document.getElementById('cf-sub');
    if (finished) {
      sub.textContent = `${state.book} ${prevChapter} complete`;
      sub.classList.add('done');
    } else {
      const read = chaptersReadIn(state.book);
      sub.textContent = counts.length ? `${read} of ${counts.length} chapters read` : '';
      sub.classList.remove('done');
    }

    // Restart the animation even if one is already running.
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if (navigator.vibrate) { try { navigator.vibrate(finished ? [14, 40, 14] : 12); } catch (e) {} }
    clearTimeout(chapterFlashTimer);
    chapterFlashTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }

  // Reading used to be recorded only for the verse the scroll settled on, so
  // a flick that carried past three verses recorded one of them and the
  // chapter never completed however carefully it had been read. Everything
  // between the last position and this one passed across the screen, so it
  // all counts.
  //
  // Jumps are not reading: switchToBook and goToChapter clear the anchor so
  // the landing verse alone is marked, and a gap too large to be a scroll is
  // treated the same way in case one slips through.
  let lastReadIdx = null;
  const READ_FILL_MAX = 40;

  // Navigation is not reading, and during a jump the feed briefly reports the
  // old scroll offset against the new book's verses — renderFeed asks for the
  // label before the new position is applied. Marking is suspended across the
  // whole move and resumes anchored wherever it actually landed.
  let readSuspended = false;

  function suspendRead() {
    clearTimeout(scrollTimeout);
    readSuspended = true;
    lastReadIdx = null;
  }

  function resumeRead() {
    lastReadIdx = currentIndex();
    readSuspended = false;
    markReadThrough(lastReadIdx);
  }

  function markReadThrough(idx) {
    if (readSuspended) return;
    const span = lastReadIdx === null ? 0 : Math.abs(idx - lastReadIdx);
    const jumped = lastReadIdx === null || span > READ_FILL_MAX;
    const lo = jumped ? idx : Math.min(lastReadIdx, idx);
    const hi = jumped ? idx : Math.max(lastReadIdx, idx);
    let changed = false;
    for (let i = lo; i <= hi; i++) {
      const verse = state.verses[i];
      if (!verse) continue;
      const key = `${state.book}:${verse.c}:${verse.v}`;
      if (!readVerses[key]) { readVerses[key] = true; changed = true; }
    }
    // Landing on a verse is not reading it: opening the app puts one on the
    // screen, and counting that would make the streak mean "opened" again by
    // the back door. The day is only recorded once the reader has moved.
    const moved = lastReadIdx !== null && idx !== lastReadIdx;
    lastReadIdx = idx;
    if (changed) {
      localStorage.setItem('sj_read', JSON.stringify(readVerses));
      if (moved) recordReadToday();
      refreshBadges(true);
      scheduleCloudSync();
    }
  }

  function updateChapterLabel() {
    const idx = currentIndex();
    const v = state.verses[idx];
    if (v) {
      document.getElementById('chapter-num').textContent = v.c;
      document.getElementById('book-name-label').textContent = state.book;
      const chapterChanged = v.c !== state.chapter;
      state.chapter = v.c;
      markReadThrough(idx);
      if (chapterChanged) {
        buildTicks();
        positionBounds();
        updateThumbFromScroll();
      }
      if (v.c !== lastSeenChapter && v.v === 1) {
        const page = feed.querySelector(`.verse-page[data-index="${idx}"]`);
        if (page) {
          page.classList.add('chapter-pulse');
          setTimeout(() => page.classList.remove('chapter-pulse'), 950);
        }
        showChapterFlash(v.c, lastSeenChapter);
      }
      lastSeenChapter = v.c;
    }
  }

  let scrollTimeout;
  feed.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    updateThumbFromScroll();
    showScrollActive();
    scrollTimeout = setTimeout(() => { loadVisibleText(); updateChapterLabel(); }, 80);
  });

  // ---------- Left scrollbar (chapter-scoped, even though feed scrolls continuously) ----------
  const track = document.getElementById('scrollbar-track');
  const thumb = document.getElementById('scrollbar-thumb');

  function chapterStartIndex(c) { return state.verses.findIndex(v => v.c === c); }
  function chapterLength(c) { return CHAPTER_COUNTS[state.book][c - 1]; }

  function buildTicks() {
    track.innerHTML = '';
    const count = chapterLength(state.chapter);
    const step = Math.max(1, Math.floor(count / 40));
    for (let i = 0; i < count; i += step) {
      const t = document.createElement('div');
      t.className = 'tick';
      track.appendChild(t);
    }
  }

  function updateThumbFromScroll() {
    const idx = currentIndex();
    const start = chapterStartIndex(state.chapter);
    const len = chapterLength(state.chapter);
    const localIdx = idx - start;
    const pct = localIdx / Math.max(1, len - 1);
    const trackRect = track.getBoundingClientRect();
    const usable = trackRect.height - 30;
    thumb.style.top = (trackRect.top + pct * usable) + 'px';
    const label = document.getElementById('scrollbar-label');
    const v = state.verses[idx];
    if (v) label.textContent = v.v;
    label.style.top = (trackRect.top + pct * usable - 5) + 'px';
  }
  window.addEventListener('resize', updateThumbFromScroll);

  function positionBounds() {
    const trackRect = track.getBoundingClientRect();
    document.getElementById('scrollbar-top-bound').style.top = (trackRect.top - 18) + 'px';
    const bottomEl = document.getElementById('scrollbar-bottom-bound');
    bottomEl.textContent = chapterLength(state.chapter);
    bottomEl.style.top = (trackRect.bottom + 4) + 'px';
  }

  let scrollActiveTimeout;
  function showScrollActive() {
    thumb.classList.add('dragging');
    document.getElementById('scrollbar-label').classList.add('show');
    clearTimeout(scrollActiveTimeout);
    scrollActiveTimeout = setTimeout(() => {
      if (!dragging) {
        thumb.classList.remove('dragging');
        document.getElementById('scrollbar-label').classList.remove('show');
      }
    }, 500);
  }

  let dragging = false;
  function handleDrag(clientY) {
    const trackRect = track.getBoundingClientRect();
    let pct = (clientY - trackRect.top) / trackRect.height;
    pct = Math.max(0, Math.min(1, pct));
    const start = chapterStartIndex(state.chapter);
    const len = chapterLength(state.chapter);
    const localIdx = Math.round(pct * (len - 1));
    const idx = start + localIdx;
    feed.scrollTo({ top: idx * feed.clientHeight, behavior: 'auto' });
    updateThumbFromScroll();
  }
  function startDrag(e) {
    dragging = true;
    thumb.classList.add('dragging');
    document.getElementById('scrollbar-label').classList.add('show');
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    handleDrag(y);
    e.preventDefault();
  }
  function moveDrag(e) {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    handleDrag(y);
  }
  function endDrag() {
    dragging = false;
    loadVisibleText();
    setTimeout(() => {
      thumb.classList.remove('dragging');
      document.getElementById('scrollbar-label').classList.remove('show');
    }, 400);
  }
  [track, thumb].forEach(el => {
    el.addEventListener('mousedown', startDrag);
    el.addEventListener('touchstart', startDrag, { passive: false });
  });
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('touchmove', moveDrag, { passive: false });
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('touchend', endDrag);

  // ---------- Drawers ----------
  function openDrawer(id) { document.getElementById(id).classList.add('open'); }
  function closeDrawer(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.drawer-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
  });

  // ---------- Book picker ----------
  // ---------- Book and chapter picker ----------
  // Every book is available now, so there is no unavailable state to draw.
  const OT_BOOK_COUNT = 39;
  let pickerOpenBook = null;

  function chapterGridHtml(book) {
    const counts = CHAPTER_COUNTS[book] || [];
    let html = '<div class="picker-chapters" data-book="' + book + '">';
    counts.forEach((verseCount, ci) => {
      const c = ci + 1;
      let read = 0;
      for (let v = 1; v <= verseCount; v++) if (readVerses[`${book}:${c}:${v}`]) read++;
      const cls = ['verse-box',
                   read === verseCount ? 'read' : '',
                   read > 0 && read < verseCount ? 'partial' : ''].filter(Boolean).join(' ');
      html += `<div class="${cls}" data-c="${c}" title="${read}/${verseCount} read">${c}</div>`;
    });
    return html + '</div>';
  }

  function drawBookPicker() {
    const list = document.getElementById('chapter-list');
    let html = '';
    BOOKS_66.forEach((book, i) => {
      if (i === 0) html += '<div class="picker-testament">Old Testament</div>';
      if (i === OT_BOOK_COUNT) html += '<div class="picker-testament">New Testament</div>';
      const isOpen = book === pickerOpenBook;
      html += `<button class="menu-item picker-book${isOpen ? ' open' : ''}" data-book="${book}">`
            + `<span>${book}</span>`
            + (book === state.book ? '<span class="picker-note">reading</span>' : '')
            + '<span class="picker-caret">▾</span></button>';
      if (isOpen) html += chapterGridHtml(book);
    });
    list.innerHTML = html;

    list.querySelectorAll('.picker-book').forEach(btn => {
      btn.onclick = () => {
        const book = btn.dataset.book;
        pickerOpenBook = pickerOpenBook === book ? null : book;
        drawBookPicker();
        if (pickerOpenBook) scrollPickerTo(pickerOpenBook);
      };
    });
    list.querySelectorAll('.picker-chapters .verse-box').forEach(cell => {
      cell.onclick = () => {
        const book = cell.closest('.picker-chapters').dataset.book;
        closeDrawer('chapter-overlay');
        switchToBook(book, parseInt(cell.dataset.c, 10), 1);
      };
    });
  }

  // Bring a book's row to the top of the sheet, clear of the sticky testament
  // header — otherwise the chapter grid fills the screen with numbers and the
  // book they belong to has scrolled out of sight. scrollIntoView would move
  // the page behind the drawer too, so the drawer is scrolled directly, and
  // measured rather than derived from offsetTop, which depends on whichever
  // ancestor happens to be positioned.
  const PICKER_HEADER_H = 30;
  function scrollPickerTo(book) {
    const list = document.getElementById('chapter-list');
    const row = list.querySelector(`.picker-book[data-book="${book}"]`);
    const drawer = list.closest('.drawer');
    if (!row || !drawer) return;
    const delta = row.getBoundingClientRect().top - drawer.getBoundingClientRect().top;
    drawer.scrollTop += delta - PICKER_HEADER_H;
  }

  document.getElementById('chapter-pill').onclick = () => {
    // Opens on the book being read, with its chapters already showing, rather
    // than at Genesis every time.
    pickerOpenBook = state.book;
    drawBookPicker();
    openDrawer('chapter-overlay');
    requestAnimationFrame(() => scrollPickerTo(state.book));
  };

  // ---------- Translation picker ----------
  function updateTranslationPill() {
    document.getElementById('translation-pill').textContent = state.translation.toUpperCase();
  }
  document.getElementById('translation-pill').onclick = () => openDrawer('translation-overlay');
  document.querySelectorAll('#translation-overlay .menu-item').forEach(btn => {
    btn.onclick = () => {
      state.translation = btn.dataset.t;
      localStorage.setItem('sj_translation', state.translation);
      updateTranslationPill();
      closeDrawer('translation-overlay');
      document.querySelectorAll('.verse-text').forEach(el => el.textContent = '…');
      loadVisibleText();
    };
  });
  updateTranslationPill();

  // ---------- Theme toggle ----------
  document.getElementById('theme-toggle').onclick = () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    localStorage.setItem('sj_theme', state.theme);
    renderThemeIcon();
  };

  // ---------- Save / Note / Share / Screenshot ----------
  function verseKey(idx) { const v = state.verses[idx]; return `${state.book}:${v.c}:${v.v}`; }

  function refreshRailState() {
    const idx = currentIndex();
    const key = verseKey(idx);
    document.getElementById('save-btn').classList.toggle('active', !!saved[key]);
  }

  document.getElementById('save-btn').onclick = () => {
    const idx = currentIndex();
    const key = verseKey(idx);
    if (saved[key]) { delete saved[key]; markDeleted('saved', key); showToast('Removed from saved'); }
    else { saved[key] = true; markAlive('saved', key); showToast('Verse saved'); }
    localStorage.setItem('sj_saved', JSON.stringify(saved));
    scheduleCloudSync();
    refreshBadges(true);
    refreshRailState();
  };

  // ---------- Notes: helpers for multi-verse ranges ----------
  function getNoteEntry(key) {
    const raw = notes[key];
    if (!raw) return null;
    if (typeof raw === 'string') return { text: raw, span: 1, startKey: key };
    if (raw.ref) {
      const start = notes[raw.ref];
      if (!start) return null;
      return { text: start.text, span: start.span || 1, startKey: raw.ref };
    }
    return { text: raw.text, span: raw.span || 1, startKey: key };
  }

  function clearNoteRange(startKey, span) {
    const parts = startKey.split(':');
    const book = parts[0], c = parseInt(parts[1]), v = parseInt(parts[2]);
    const arr = BOOK_VERSES[book];
    if (!arr) { delete notes[startKey]; return; }
    const startIdx = arr.findIndex(x => x.c === c && x.v === v);
    if (startIdx < 0) { delete notes[startKey]; return; }
    for (let i = 0; i < span; i++) {
      const vv = arr[startIdx + i];
      if (vv) delete notes[`${book}:${vv.c}:${vv.v}`];
    }
  }

  let noteEditState = { idx: 0, span: 1, maxSpan: 1 };

  function renderNoteRangeLabel() {
    const idx = noteEditState.idx;
    const startV = state.verses[idx];
    const endV = state.verses[idx + noteEditState.span - 1];
    const label = noteEditState.span === 1
      ? `${state.book} ${startV.c}:${startV.v}`
      : `${state.book} ${startV.c}:${startV.v} – ${endV.c}:${endV.v}`;
    document.getElementById('note-range-label').textContent = label;
    document.getElementById('note-ref').textContent = label;
    const texts = [];
    for (let i = 0; i < noteEditState.span; i++) {
      const vv = state.verses[idx + i];
      if (vv) texts.push(vv.kjv);
    }
    document.getElementById('note-verse-preview').textContent = texts.join(' ');
  }

  function openNoteEditor(idx) {
    const key = verseKey(idx);
    const existing = getNoteEntry(key);
    noteEditState.idx = idx;
    noteEditState.span = existing ? existing.span : 1;
    noteEditState.maxSpan = Math.min(12, state.verses.length - idx);
    document.getElementById('note-textarea').value = existing ? existing.text : '';
    document.getElementById('note-textarea').dataset.key = key;
    renderNoteRangeLabel();
    openDrawer('note-overlay');
  }

  document.getElementById('note-range-minus').onclick = () => {
    if (noteEditState.span > 1) { noteEditState.span--; renderNoteRangeLabel(); }
  };
  document.getElementById('note-range-plus').onclick = () => {
    if (noteEditState.span < noteEditState.maxSpan) { noteEditState.span++; renderNoteRangeLabel(); }
  };

  document.getElementById('note-btn').onclick = () => openNoteEditor(currentIndex());

  function refreshNoteIndicatorForIdx(idx) {
    const page = feed.querySelector(`.verse-page[data-index="${idx}"]`);
    if (!page) return;
    const existingDot = page.querySelector('.note-indicator');
    const v = state.verses[idx];
    const key = `${state.book}:${v.c}:${v.v}`;
    if (notes[key] && !existingDot) {
      const dot = document.createElement('span');
      dot.className = 'note-indicator';
      dot.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="4"/></svg> has a note';
      dot.style.cursor = 'pointer';
      dot.onclick = () => openNoteEditor(idx);
      page.appendChild(dot);
    } else if (!notes[key] && existingDot) {
      existingDot.remove();
    }
  }

  document.getElementById('save-note-confirm').onclick = () => {
    const key = document.getElementById('note-textarea').dataset.key;
    const existing = getNoteEntry(key);
    const oldSpan = existing ? existing.span : 0;
    const oldIdx = noteEditState.idx;
    if (existing) clearNoteRange(existing.startKey, existing.span);
    const val = document.getElementById('note-textarea').value.trim();
    if (existing && !val) markDeleted('notes', existing.startKey);
    if (val) {
      notes[key] = { text: val, span: noteEditState.span };
      markAlive('notes', key);
      for (let i = 1; i < noteEditState.span; i++) {
        const vv = state.verses[noteEditState.idx + i];
        if (vv) notes[`${state.book}:${vv.c}:${vv.v}`] = { ref: key };
      }
    }
    localStorage.setItem('sj_notes', JSON.stringify(notes));
    scheduleCloudSync();
    closeDrawer('note-overlay');
    showToast('Note saved');
    refreshBadges(true);
    const affected = Math.max(oldSpan, noteEditState.span);
    for (let i = 0; i < affected; i++) refreshNoteIndicatorForIdx(oldIdx + i);
  };

  document.getElementById('share-btn').onclick = async () => {
    const idx = currentIndex();
    const v = state.verses[idx];
    const text = await getVerseText(idx);
    const shareText = `"${text}"\n${state.book} ${v.c}:${v.v}`;
    if (navigator.share) {
      try { await navigator.share({ text: shareText }); } catch (e) {}
    } else {
      await navigator.clipboard.writeText(shareText);
      showToast('Copied to clipboard');
    }
  };

  document.getElementById('screenshot-btn').onclick = () => {
    const idx = currentIndex();
    const v = state.verses[idx];
    const textEl = document.getElementById(`vtext-${idx}`);
    const canvas = document.createElement('canvas');
    const W = 1080, H = 1080;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const isDark = state.theme === 'dark';
    ctx.fillStyle = isDark ? '#121212' : '#FAF9F6';
    ctx.fillRect(0, 0, W, H);

    const logo = new Image();
    logo.crossOrigin = 'anonymous';
    logo.onload = () => drawRest();
    logo.onerror = () => drawRest();
    logo.src = 'cross.png';

    function drawRest() {
      const text = textEl.textContent;
      ctx.font = '48px Georgia, serif';
      ctx.textAlign = 'center';
      const words = text.split(' ');
      let lines = [], cur = '';
      words.forEach(w => {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width > W - 160) { lines.push(cur); cur = w; }
        else cur = test;
      });
      if (cur) lines.push(cur);
      const lineHeight = 64;

      const logoSize = 130;
      // Gap between the cross and the first line of verse text. The text is
      // drawn on its alphabetic baseline, so roughly 35px of this is eaten by
      // the ascenders — 150 leaves a visible gap rather than a crowded one.
      const logoGap = 150;
      const blockHeight = logoSize + logoGap + (lines.length * lineHeight) + 70;
      // Sit the block a little above centre so the cross has room to breathe
      // at the top of the image.
      let cursorY = H / 2 - blockHeight / 2 - 40;

      if (logo.complete && logo.naturalWidth > 0) {
        ctx.drawImage(logo, W / 2 - logoSize / 2, cursorY, logoSize, logoSize);
      }
      cursorY += logoSize + logoGap;

      ctx.fillStyle = isDark ? '#f5f5f0' : '#1A1A1A';
      lines.forEach((line, i) => ctx.fillText(line, W / 2, cursorY + i * lineHeight));
      cursorY += lines.length * lineHeight;

      ctx.font = '28px -apple-system, sans-serif';
      ctx.fillStyle = isDark ? '#8a8a85' : '#6B6B66';
      ctx.fillText(`${state.book} ${v.c}:${v.v}`, W / 2, cursorY + 50);

      canvas.toBlob(async blob => {
        const filename = `${state.book}-${v.c}-${v.v}.png`;
        const file = new File([blob], filename, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            return;
          } catch (e) {
            // user cancelled the share sheet, or share failed — fall through to download
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        a.click();
        showToast('Image downloaded');
      });
    }
  };

  function showToast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.classList.remove('show'), ms || 1800);
  }

  // Firestore failures were being swallowed — one catch showed a fixed
  // message and the background sync discarded the error entirely — which left
  // "sync failed" with nothing to act on. Name the cause instead.
  function syncErrorMessage(e) {
    const code = (e && e.code) ? String(e.code) : '';
    if (code.indexOf('permission-denied') !== -1) {
      return 'Sync blocked: Firestore rules deny access to your user document';
    }
    if (code.indexOf('unauthenticated') !== -1) {
      return 'Sync failed: not authenticated with Firestore';
    }
    if (code.indexOf('invalid-argument') !== -1 || code.indexOf('resource-exhausted') !== -1) {
      return 'Sync failed: the synced document is too large (' + code + ')';
    }
    if (code.indexOf('unavailable') !== -1 || code.indexOf('deadline') !== -1) {
      return 'Sync failed: could not reach Firestore (offline?)';
    }
    return 'Sync failed: ' + (code || (e && e.message) || 'unknown');
  }

  // null = not attempted yet, true = last attempt succeeded, false = failed.
  // The account row used to claim "synced" unconditionally, which was a lie
  // whenever Firestore was refusing us.
  let lastSyncOk = null;

  function reportSyncError(e) {
    console.error('[BibleScroll] Firestore sync failed:', e);
    lastSyncOk = false;
    showToast(syncErrorMessage(e), 5000);
    if (typeof refreshHomeIfOpen === 'function') refreshHomeIfOpen();
  }

  function noteSyncOk() {
    const changed = lastSyncOk !== true;
    lastSyncOk = true;
    if (changed && typeof refreshHomeIfOpen === 'function') refreshHomeIfOpen();
  }

  // ---------- Strong's lexicon ----------
  // The same few thousand definitions repeat across 445,000 interlinear
  // words, so they live in one file the app fetches once instead of being
  // written into every verse. Fetched the first time the Original language
  // tab is opened, not at startup.
  let strongsLex = null;
  let strongsPending = null;
  function ensureStrongs(then) {
    if (strongsLex) { then(); return; }
    if (!strongsPending) {
      strongsPending = fetch('data/strongs.json')
        .then(r => r.json())
        .then(j => { strongsLex = j; })
        .catch(() => { strongsLex = {}; });
    }
    strongsPending.then(then);
  }

  // ---------- Badges ----------
  // Nothing here is stored when it is earned. Every badge is a question asked
  // of the reading itself, so clearing a chapter takes its badges with it and
  // a badge can never outlive the reading behind it. The only thing kept is
  // which ones have already been announced.
  //
  // Nothing rewards speed. Reading credits every verse scrolled past, so a
  // fast flick through Psalms would win any volume-per-day badge going; these
  // ask what has been read and whether the reader came back, not how quickly.
  const PENTATEUCH = BOOKS_66.slice(0, 5);
  const GOSPELS = ['Matthew', 'Mark', 'Luke', 'John'];
  const MINOR_PROPHETS = BOOKS_66.slice(27, 39);
  const PAULINE = BOOKS_66.slice(44, 57);
  const LONG_ROADS = ['Genesis', 'Psalms', 'Isaiah', 'Jeremiah', 'Ezekiel'];
  const OT_BOOKS = BOOKS_66.slice(0, OT_BOOK_COUNT);
  const NT_BOOKS = BOOKS_66.slice(OT_BOOK_COUNT);

  // One pass over the reading, shared by every test below, so a badge sweep
  // does not walk all 31,102 verses once per badge.
  function badgeStats() {
    const done = new Set();
    const complete = new Set();
    let chapters = 0;
    BOOKS_66.forEach(book => {
      const counts = CHAPTER_COUNTS[book] || [];
      let full = 0;
      counts.forEach((verseCount, ci) => {
        const c = ci + 1;
        let read = 0;
        for (let v = 1; v <= verseCount; v++) if (readVerses[`${book}:${c}:${v}`]) read++;
        if (read === verseCount) { done.add(`${book}:${c}`); full++; chapters++; }
      });
      if (counts.length && full === counts.length) complete.add(book);
    });
    return {
      done, complete, chapters,
      books: complete.size,
      streak: computeStreak(),
      returned: hasReturned(),
      notes: countDistinctNotes(),
      saved: Object.keys(saved).length,
    };
  }

  const chaptersDone = (st, book, from, to) => {
    for (let c = from; c <= to; c++) if (!st.done.has(`${book}:${c}`)) return false;
    return true;
  };
  const booksDone = (st, list) => list.every(b => st.complete.has(b));

  const BADGES = [
    // Structure — the shape of the book itself.
    { id: 'first-chapter', group: 'Structure', name: 'First Chapter',
      note: 'Finish a chapter', test: st => st.chapters >= 1 },
    { id: 'gospels', group: 'Structure', name: 'The Gospels',
      note: 'Matthew, Mark, Luke and John', test: st => booksDone(st, GOSPELS) },
    { id: 'law', group: 'Structure', name: 'The Law',
      note: 'Genesis through Deuteronomy', test: st => booksDone(st, PENTATEUCH) },
    { id: 'twelve', group: 'Structure', name: 'The Twelve',
      note: 'All twelve minor prophets', test: st => booksDone(st, MINOR_PROPHETS) },
    { id: 'paul', group: 'Structure', name: "Paul's Hand",
      note: 'All thirteen of his letters', test: st => booksDone(st, PAULINE) },
    { id: 'long-roads', group: 'Structure', name: 'The Long Roads',
      note: 'Genesis, Psalms, Isaiah, Jeremiah, Ezekiel', test: st => booksDone(st, LONG_ROADS) },
    { id: 'nt', group: 'Structure', name: 'New Testament',
      note: 'All twenty-seven books', test: st => booksDone(st, NT_BOOKS) },
    { id: 'ot', group: 'Structure', name: 'Old Testament',
      note: 'All thirty-nine books', test: st => booksDone(st, OT_BOOKS) },
    { id: 'whole', group: 'Structure', name: 'Whole Counsel',
      note: 'Every book of the Bible', test: st => st.books === 66 },

    // Landmarks — particular ground, which suits this app more than volume.
    { id: 'creation', group: 'Landmarks', name: 'In the Beginning',
      note: 'Genesis 1 to 3', test: st => chaptersDone(st, 'Genesis', 1, 3) },
    { id: 'psalm119', group: 'Landmarks', name: 'The Long Psalm',
      note: 'All 176 verses of Psalm 119', test: st => st.done.has('Psalms:119') },
    { id: 'isaiah53', group: 'Landmarks', name: 'The Suffering Servant',
      note: 'Isaiah 53', test: st => st.done.has('Isaiah:53') },
    { id: 'sermon', group: 'Landmarks', name: 'On the Mount',
      note: 'Matthew 5 to 7', test: st => chaptersDone(st, 'Matthew', 5, 7) },
    { id: 'romans8', group: 'Landmarks', name: 'No Condemnation',
      note: 'Romans 8', test: st => st.done.has('Romans:8') },
    { id: 'love', group: 'Landmarks', name: 'The More Excellent Way',
      note: '1 Corinthians 13', test: st => st.done.has('1 Corinthians:13') },
    { id: 'passion', group: 'Landmarks', name: 'Four Accounts',
      note: 'The passion in all four Gospels',
      test: st => chaptersDone(st, 'Matthew', 26, 27) && chaptersDone(st, 'Mark', 14, 15)
                  && chaptersDone(st, 'Luke', 22, 23) && chaptersDone(st, 'John', 18, 19) },
    { id: 'ending', group: 'Landmarks', name: 'All Things New',
      note: 'Revelation 21 and 22', test: st => chaptersDone(st, 'Revelation', 21, 22) },

    // Depth — the study side, which is what this app has that a plain reader does not.
    { id: 'first-save', group: 'Depth', name: 'Kept',
      note: 'Save a verse', test: st => st.saved >= 1 },
    { id: 'first-note', group: 'Depth', name: 'In Your Own Words',
      note: 'Write a note', test: st => st.notes >= 1 },
    { id: 'notes-25', group: 'Depth', name: 'Margin Notes',
      note: 'Twenty-five notes', test: st => st.notes >= 25 },

    // Consistency — and one badge for coming back.
    { id: 'streak-7', group: 'Consistency', name: 'Seven Days',
      note: 'A week of reading in a row', test: st => st.streak >= 7 },
    { id: 'streak-30', group: 'Consistency', name: 'Thirty Days',
      note: 'A month in a row', test: st => st.streak >= 30 },
    { id: 'streak-100', group: 'Consistency', name: 'Hundred Days',
      note: 'A hundred in a row', test: st => st.streak >= 100 },
    { id: 'streak-365', group: 'Consistency', name: 'A Full Year',
      note: 'Three hundred and sixty-five in a row', test: st => st.streak >= 365 },
    { id: 'return', group: 'Consistency', name: 'Return',
      note: 'Come back after a week away', test: st => st.returned },
  ];

  const badgesSeen = JSON.parse(localStorage.getItem('sj_badges_seen') || '[]');
  // A first run with reading already behind it absorbs what it has earned
  // without announcing twenty badges at once.
  const hadBadgeRecord = localStorage.getItem('sj_badges_seen') !== null;

  function badgeSectionHtml() {
    const { earned } = refreshBadges(false);
    const set = new Set(earned);
    let html = `<p class="badge-count">${earned.length} of ${BADGES.length} earned</p>`
             + `<div class="badge-grid">`;
    BADGES.forEach(b => {
      html += `<div class="badge-card${set.has(b.id) ? ' earned' : ''}">`
            + `<p class="badge-name">${b.name}</p>`
            + `<p class="badge-note">${b.note}</p></div>`;
    });
    return html + `</div>`;
  }

  function refreshBadges(announce) {
    const st = badgeStats();
    const earned = BADGES.filter(b => b.test(st)).map(b => b.id);
    const fresh = earned.filter(id => !badgesSeen.includes(id));
    // A badge no longer earned — a chapter cleared — is forgotten, so it
    // announces again if the reading comes back.
    const kept = badgesSeen.filter(id => earned.includes(id));
    if (fresh.length || kept.length !== badgesSeen.length) {
      badgesSeen.length = 0;
      badgesSeen.push(...kept, ...fresh);
      localStorage.setItem('sj_badges_seen', JSON.stringify(badgesSeen));
      scheduleCloudSync();
    }
    if (announce && fresh.length) {
      showBadgeFlash(BADGES.find(b => b.id === fresh[0]), fresh.length);
    }
    return { stats: st, earned };
  }

  let badgeFlashTimer;
  function showBadgeFlash(badge, total) {
    if (!badge) return;
    const el = document.getElementById('badge-flash');
    document.getElementById('bf-name').textContent = badge.name;
    document.getElementById('bf-note').textContent =
      total > 1 ? `${badge.note} — and ${total - 1} more` : badge.note;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if (navigator.vibrate) { try { navigator.vibrate([14, 40, 14]); } catch (e) {} }
    clearTimeout(badgeFlashTimer);
    badgeFlashTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // Run once at startup: a first launch with reading already behind it takes
  // what it has earned quietly, and afterwards new ones announce themselves.
  setTimeout(() => refreshBadges(hadBadgeRecord), 0);

  // ---------- Returning from a cross-reference ----------
  // Following a related verse was one-way: it moved book and chapter with no
  // record of where the reader had been. The trail is a stack, so a chain of
  // references unwinds one step at a time.
  const refTrail = [];

  function pushRefTrail() {
    const verse = state.verses[currentIndex()];
    if (!verse) return;
    refTrail.push({ book: state.book, c: verse.c, v: verse.v });
    updateReturnPill();
  }

  function clearRefTrail() {
    refTrail.length = 0;
    updateReturnPill();
  }

  function updateReturnPill() {
    const pill = document.getElementById('return-pill');
    const back = refTrail[refTrail.length - 1];
    if (!back) { pill.classList.remove('show'); return; }
    document.getElementById('return-label').textContent =
      `Back to ${back.book} ${back.c}:${back.v}`;
    pill.classList.add('show');
  }

  document.getElementById('return-pill').onclick = () => {
    const back = refTrail.pop();
    if (!back) return;
    updateReturnPill();
    switchToBook(back.book, back.c, back.v, { keepTrail: true });
  };

  // ---------- Deep study ----------
  function studyKey(idx) { const v = state.verses[idx]; return `${v.c}:${v.v}`; }

  function openStudy(idx) {
    const v = state.verses[idx];
    const drawer = document.getElementById('study-drawer');
    drawer.innerHTML = `
      <div class="drawer-handle"></div>
      <p class="drawer-ref">${state.book} ${v.c}:${v.v}</p>
      <p class="drawer-verse">${v.kjv}</p>
      <button class="menu-item" data-opt="explain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Explain easier</button>
      <button class="menu-item" data-opt="original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/></svg>Original language</button>
      <button class="menu-item" data-opt="deeper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/></svg>Deeper study</button>
      <button class="menu-item" data-opt="related"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Related verses</button>
    `;
    drawer.querySelectorAll('[data-opt]').forEach(btn => {
      btn.onclick = () => renderStudyResult(idx, btn.dataset.opt);
    });
    openDrawer('study-overlay');
  }

  function renderStudyResult(idx, opt) {
    // Word meanings live in the shared lexicon, so the Original language tab
    // cannot render until it has loaded. Fetch it once, then draw.
    if (opt === 'original' && !strongsLex) {
      ensureStrongs(() => renderStudyResult(idx, opt));
      return;
    }
    const v = state.verses[idx];
    const key = studyKey(idx);
    const data = (BOOK_STUDY[state.book] || {})[key] || {};
    const drawer = document.getElementById('study-drawer');
    const titles = { explain: 'Explain easier', original: 'Original language', deeper: 'Deeper study', related: 'Related verses' };

    let body = '';
    if (opt === 'explain') {
      body = `<p class="study-body">${data.explain || 'No commentary available for this verse yet.'}</p>`
             + (data.explain ? sourceNote(data.srcExplain) : '');
    } else if (opt === 'deeper') {
      body = `<p class="study-body">${data.deeper || 'No deeper study available for this verse yet.'}</p>`
             + (data.deeper ? sourceNote(data.srcDeeper) : '');
    } else if (opt === 'original') {
      const words = data.greek || [];
      body = words.map(w => {
        const meaning = w.meaning || (strongsLex && strongsLex[w.strongs]) || '';
        return `
        <div class="greek-word">
          <div class="greek-orig">${w.word} <span style="color:var(--text-secondary); font-size:13px;">— ${w.english}</span></div>
          <div class="greek-meaning">${meaning}</div>
        </div>
      `;
      }).join('') || '<p class="study-body">No word data available for this verse.</p>';
    } else if (opt === 'related') {
      const refs = data.related || [];
      // A cross-reference you cannot follow is a dead end in the one place a
      // tap is most expected. Refs parse as "Book C:V"; the ones whose book is
      // loaded become links, the rest stay legible but plainly inert.
      body = refs.map(r => {
        const m = String(r).match(/^((?:[123]\s)?[A-Za-z][A-Za-z ]*?)\s+(\d+):(\d+)$/);
        if (!m) return `<div class="related-link unavailable">${r}</div>`;
        const book = m[1].trim();
        if (!CONTENT_AVAILABLE.includes(book)) {
          return `<div class="related-link unavailable">${r}<span class="rl-note">not added yet</span></div>`;
        }
        return `<div class="related-link available" data-book="${book}" data-c="${m[2]}" data-v="${m[3]}">${r}</div>`;
      }).join('') || '<p class="study-body">No related verses found.</p>';
    }

    // Both cards state the verse's own point rather than summarising either
    // tab, so both belong on both tabs. A card is only drawn where there is
    // something to put in it: books whose takeaway would just be the Explain
    // text cut short carry none, and show no card rather than a restatement.
    const studyTab = opt === 'explain' || opt === 'deeper';
    const takeawayCard = studyTab && (data.takeaway || '').trim();
    const applyCard = studyTab && (data.apply || '').trim();
    drawer.innerHTML = `
      <div class="drawer-handle"></div>
      <button class="back-btn" id="study-back">‹ Back</button>
      <p class="study-title">${titles[opt]}</p>
      <p class="drawer-ref">${state.book} ${v.c}:${v.v}</p>
      ${body}
      ${takeawayCard ? `
        <div class="study-card">
          <div class="study-card-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>KEY TAKEAWAY</div>
          <p>${data.takeaway || ''}</p>
        </div>
      ` : ''}
      ${applyCard ? `
        <div class="study-card">
          <div class="study-card-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12h.01M12 3l1.9 1.9a1 1 0 0 0 .7.29H17a2 2 0 0 1 2 2v2.4a1 1 0 0 0 .29.7L21 12l-1.71 1.71a1 1 0 0 0-.29.7V17a2 2 0 0 1-2 2h-2.4a1 1 0 0 0-.7.29L12 21l-1.9-1.9a1 1 0 0 0-.7-.29H7a2 2 0 0 1-2-2v-2.4a1 1 0 0 0-.29-.7L3 12l1.71-1.71a1 1 0 0 0 .29-.7V7a2 2 0 0 1 2-2h2.4a1 1 0 0 0 .7-.29z"/></svg>APPLY IT</div>
          <p>${data.apply || ''}</p>
        </div>
      ` : ''}
      <div class="bottom-row">
        <button id="sr-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
